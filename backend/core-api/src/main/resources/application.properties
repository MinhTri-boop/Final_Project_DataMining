spring.application.name=core-api

# Database Configuration (Reading from Environment Variables for DevOps CI/CD)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/gtd_dw}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Cache Configuration
spring.cache.type=simple

# ML Service Configuration
ml.service.url=${ML_SERVICE_URL:http://localhost:8000/predict}
